<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Lost in the Cosmos</title>
<style>
:root{--bg:#04050d;--ink:#ece9ff;--glow:#ffd98a;--accent:#8ab4ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 115%,#1b1544 0%,var(--bg) 62%) fixed;
  color:var(--ink);
  font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
main{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:1.5rem;
}
.num{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:600;
  font-size:clamp(5.5rem,24vw,13rem);
  line-height:1;
  text-shadow:0 0 40px var(--accent);
  user-select:none;
  margin-bottom:0.75rem;
}
.planet{
  position:relative;
  width:.78em;
  height:.78em;
  margin:0 .03em;
  border-radius:50%;
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.55),transparent 32%),
             radial-gradient(circle at 36% 32%,var(--accent),#2b2f6e 68%,#0b0c24);
  box-shadow:inset -.08em -.06em .16em rgba(0,0,0,.65),0 0 .35em var(--accent);
}
.planet::before{
  content:"";
  position:absolute;
  left:-30%;
  right:-30%;
  top:44%;
  height:15%;
  border:.022em solid var(--glow);
  border-radius:50%;
  transform:rotate(-18deg);
  opacity:.85;
  box-shadow:0 0 .12em var(--glow);
}
.moon{
  position:absolute;
  top:50%;
  left:50%;
  width:.13em;
  height:.13em;
  margin:-.065em;
  border-radius:50%;
  background:var(--ink);
  animation:orbit 7s linear infinite;
}
@keyframes orbit{
  from{transform:rotate(0) translateX(.66em) rotate(0)}
  to{transform:rotate(360deg) translateX(.66em) rotate(-360deg)}
}
.desc{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:500;
  font-size:clamp(1.8rem,5vw,3rem);
  letter-spacing:0.04em;
  color:var(--ink);
  text-shadow:0 0 24px rgba(138,180,255,.35);
  margin-bottom:1.5rem;
}
.solution{
  display:inline-flex;
  align-items:center;
  gap:0.4rem;
  font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
  font-size:clamp(0.88rem,2.2vw,1.05rem);
  color:var(--ink);
  background:rgba(138,180,255,.12);
  border:1px solid rgba(138,180,255,.3);
  padding:0.65rem 1.4rem;
  border-radius:999px;
  text-decoration:none;
  font-weight:500;
  transition:all .2s ease;
}
.solution:hover{
  background:var(--accent);
  color:#05070f;
  border-color:var(--accent);
  transform:translateY(-2px);
  box-shadow:0 6px 24px -6px var(--accent);
}
.solution:focus-visible{
  outline:2px solid var(--glow);
  outline-offset:3px;
}
@media (prefers-reduced-motion:reduce){
  .moon{animation:none}
  .solution{transition:none}
}
</style>
</head>
<body>
  <main>
    <h1 class="num" aria-label="Error 404">
      <span aria-hidden="true">4</span><span class="planet" aria-hidden="true"><i class="moon"></i></span><span aria-hidden="true">4</span>
    </h1>
    <p class="desc">Not Found</p>
    <a class="solution" href="index.html#home">Return to Cosmic Canvas &rarr;</a>
  </main>
</body>
</html>
